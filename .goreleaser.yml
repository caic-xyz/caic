# Defines cross-platform build targets, archives, and release publishing for the CLI binary.

version: 2

builds:
  - id: caic
    main: ./backend/cmd/caic
    binary: caic
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

universal_binaries:
  - id: caic
    replace: true
    name_template: caic

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - contrib/config.toml
      - src: '{{ if eq .Os "linux" }}contrib/caic.service{{ end }}'
      - src: '{{ if eq .Os "darwin" }}contrib/com.caic.caic.plist{{ end }}'

checksum:
  name_template: 'checksums.txt'

changelog:
  use: git
