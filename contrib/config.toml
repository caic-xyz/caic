# caic configuration
# Copy to ~/.config/caic/config.toml and edit as needed.

# ── Core ─────────────────────────────────────────────────────────────────────

[core]
# Parent directory containing the git repositories managed by caic.
#root = "."

# Load exported variables from the user's interactive login shell once at startup
# (macOS/Linux). Shell exports replace inherited values, including PATH and
# SSH_AUTH_SOCK; process/session bookkeeping stays unchanged. A failed probe warns
# and keeps the inherited environment. Startup waits at most 6 seconds.
# This runs user startup scripts without a terminal. Set false to disable.
# Config directory selection happens before loading the shell environment.
#shell_env = true

# Auto-update schedule (cron expression, local time). Checks GitHub Releases and
# replaces the binary on a match. Unset = daily at 04:50; "" disables.
# e.g. auto_update = "50 4 * * *"

# Remove unused md-built images on this cron schedule (local time). Unset =
# daily at 05:00; "" disables.
# e.g. prune = "0 5 * * *"

# Repack repositories with at least 1 GiB of Git objects only when they have
# more than 1,000 loose objects using more than 64 MiB. This keeps the checkout's
# object store ready for direct transfer into new task containers.
# Unset = daily at 02:00 local time; "" disables.
# e.g. repo_repack = "0 2 * * *"

# Environment variables added to those inherited by the server process. Each key
# falls back to the host environment when omitted here.
[core.env]
# Tailscale API key: required for Tailscale ephemeral node.
# Obtain from https://login.tailscale.com/admin/settings/keys
# TAILSCALE_API_KEY = "tskey-..."
# Gemini API key for title generation when provider is "gemini".
# Obtain from https://aistudio.google.com/app/apikey
# GEMINI_API_KEY = "AIza..."

# ── Server ───────────────────────────────────────────────────────────────────

[server]
# HTTP listen address for the web UI. Defaults to localhost only; prefix with
# "0.0.0.0" to listen on all IPv4 addresses.
# Safety: the MCP endpoint at /api/caic/v1/mcp is disabled when no OAuth login
# is configured and the server binds a non-loopback address, so an exposed
# server never serves MCP without authentication. Configure OAuth login below to
# enable MCP off-localhost.
#http = ":2242"

# Public base URL. "auto" locks the hostname from the first FQDN request and
# supports browser OAuth login plus same-origin, session-authenticated MCP (Go
# Mode), but disables remote MCP OAuth because it cannot provide an immutable
# issuer. Set an explicit URL for remote MCP clients. HTTPS is required except
# for explicit loopback development origins.
#external_url = "auto"  # e.g. "https://caic.example.com"

# Direct reverse proxies trusted to set Forwarded or X-Forwarded-* origin
# headers. Leave empty when caic is reached directly. Never include client
# networks; only include the proxy peers that connect to caic.
#trusted_proxies = []  # e.g. ["127.0.0.1/32", "::1/128"]

# MaxMind MMDB file for country-code resolution and logging. Relative paths
# resolve against the config directory. Empty defaults to
# "~/.config/caic/GeoLite2-Country.mmdb" if present, otherwise geoip is disabled.
# https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
#geo_db = ""  # e.g. "~/.config/caic/GeoLite2-Country.mmdb"

# Allowed origins; requests from non-matching IPs are rejected with HTTP 403.
# Named:
# - "anthropic" (published Anthropic outbound IPs): necessary for Claude MCP.
# - "github" (GitHub webhook IPs): necessary for GitHub App.
# - "local" (loopback/private): highly recommended.
# - "openai" (published ChatGPT integration and Codex cloud IPs): necessary for ChatGPT MCP.
# - "tailscale" (100.64.0.0/10): very useful if you use tailscale.com.
# Others:
# - CIDR: e.g. "203.0.113.0/24"
# - Country codes: ISO 3166-1 alpha-2 (e.g. "CA"), require geo_db.
#allow_origins = ["local", "tailscale", "github"]

# ── Voice Gateway ────────────────────────────────────────────────────────────

# Voice stays disabled until mode is explicitly set to embedded or external.
[voice-gateway]
#mode = "disabled"  # "disabled" (default), "embedded", or "external".
# Standalone voice gateway URL.
#url = ""  # e.g. "https://voice.example.com"
# External mode also requires a fixed server.external_url and an instance ID.
#token_mode = "scoped"  # "scoped" (default) or "oauth"
#
# "scoped" issues the transitional Ed25519 token and needs a PKCS#8 key.
# Generate one with:
# openssl genpkey -algorithm Ed25519 -out ~/.config/caic/voice-signing-key.pem
# The startup log prints its public key for the gateway's [[trusted_issuers]]
# entry (service = "caic", issuer = server.external_url).
#signing_private_key_pem = ""  # e.g. "voice-signing-key.pem"
#
# "oauth" issues a narrow OAuth 2.0 access token (aud=voice-gateway,
# scope=voice.session) signed by caic's OAuth authorization server. No Ed25519
# key is needed. Configure the gateway's [[trusted_issuers]] entry with
# oauth = true for the same service and issuer; it discovers the key set at
# server.external_url/.well-known/oauth-authorization-server.
#instance_id = ""  # e.g. "caic-main"

# Embedded pipelines match the standalone voice-gateway configuration below.
# Provider credentials come from the gateway process environment. Only embedded
# mode probes provider availability and starts the available configured pipelines.
# The host owns HTTP and authentication; do not set config.server.http.
[voice-gateway.config.server]
#webrtc_udp_port = 0

# Set effort on [[voice-gateway.config.realtime]],
# [[voice-gateway.config.chat]], or [voice-gateway.config.local_stack.llm]:
# Omit effort to send no effort option; "off" requests minimal thinking;
# "low", "medium", "high", "xhigh", and "max" request increasing effort.
# Supported levels depend on the model. Omit it for models that reject effort.
#
# Prices checked 2026-11-05: USD, uncached input and output.

# Local-stack, chat, and native llama.cpp audio load on first use. A choice counts as
# one instance, including its ASR/LLM/TTS workers. Active sessions pin instances;
# another choice waits when all instances are busy. Idle choices are evicted
# first when capacity is needed. External servers remain operator-owned.
[voice-gateway.config.local_stack_runtime]
idle_timeout_seconds = 3600
max_instances = 1

# Realtime Audio models.

[[voice-gateway.config.realtime]]
# https://aistudio.google.com/docs/pricing#gemini-3.8-live
# Text: $0.75/MTok in, $4.50/MTok out. Audio: $0.30/hr in, $1.08/hr out.
label = "Gemini Live"
provider = "gemini"
model = "gemini-3.8-live"

[[voice-gateway.config.realtime]]
# https://aistudio.google.com/docs/pricing#gemini-3.8-live
# Text: $0.75/MTok in, $4.50/MTok out. Audio: $0.30/hr in, $1.08/hr out.
label = "Gemini Live Thinking"
provider = "gemini"
model = "gemini-3.8-live-extended-thinking"

[[voice-gateway.config.realtime]]
# https://developers.openai.com/api/docs/models/gpt-realtime-2.1-mini
# Text: $0.60/MTok in, $2.40/MTok out. Audio: ~$0.36/hr in, ~$1.44/hr out.
label = "GPT Realtime mini"
provider = "openai"
model = "gpt-realtime-2.1-mini"
effort = "low"

[[voice-gateway.config.realtime]]
# https://developers.openai.com/api/docs/models/gpt-realtime-2.1
# Text: $4.00/MTok in, $24.00/MTok out. Audio: ~$1.152/hr in, ~$4.608/hr out.
label = "GPT Realtime ($)"
provider = "openai"
model = "gpt-realtime-2.1"
effort = "low"

# Native audio-to-audio LFM3, independent of the ASR/LLM/TTS stack.
# llamacppsrv downloads and starts the managed llama.cpp audio server.
[[voice-gateway.config.realtime]]
label = "LFM3 audio"
provider = "llamacpp"
llamacppsrv = true
model = "LiquidAI/LFM3-Audio-2B-GGUF/LFM3-Audio-2B-Q4_K_M.gguf"
context_size = 65536
# remote = "http://127.0.0.1:8080" directly on the choice.

# Remote LLMs
# Clients transcribe and speak for all chat choices. Credentials are listed in
# https://github.com/maruel/gomode/blob/main/contrib/voice-gateway.env.example,
# using genai's provider environment variables.

[[voice-gateway.config.chat]]
# https://developers.openai.com/api/docs/models/gpt-6-luna
# $0.10/MTok in, $0.50/MTok out; prompts >272K tokens: $0.20/MTok in, $0.75/MTok out.
label = "GPT 6 Luna"
provider = "openai"
model = "gpt-6-luna"
effort = "low"

[[voice-gateway.config.chat]]
# https://platform.claude.com/docs/en/models/haiku-5-5/overview
# $0.10/MTok in, $0.50/MTok out; prompts >100K tokens: $0.50/MTok in, $2.50/MTok out.
label = "Claude Haiku 5.5"
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"

[[voice-gateway.config.chat]]
# https://aistudio.google.com/docs/pricing#gemini-3.8-flash
