provider = "gemini"
model = "gemini-3.8-flash"
effort = "low"

[[voice-gateway.config.chat]]
# https://aistudio.google.com/docs/pricing#gemini-3.5-flash-lite
# $0.30/MTok in, $2.50/MTok out.
