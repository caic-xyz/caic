model = "gemini-flash-lite-latest"
effort = "low"

[[voice-gateway.config.chat]]
# https://api-docs.deepseek.com/quick_start/pricing/
# Off-peak: $0.15/MTok in, $0.60/MTok out. Peak: $0.30/MTok in, $1.20/MTok out.
