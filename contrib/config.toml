# caic configuration
# Copy to ~/.config/caic/config.toml and edit as needed.

# ── Core ─────────────────────────────────────────────────────────────────────

[core]
# Parent directory containing git repositories managed by caic.
#root = "."

# Auto-update schedule (cron expression, local time). Checks GitHub Releases
# and replaces the binary on match. Set to "off" to disable.
# Default: "50 4 * * *" (daily at 04:50).
#auto_update = "50 4 * * *"

# Tailscale API key — required for Tailscale ephemeral node.
# Obtain from https://login.tailscale.com/admin/settings/keys
#tailscale_api_key = ""

# ── Server ───────────────────────────────────────────────────────────────────

[server]
# HTTP listen address for the web UI.
#http = ":8080"

# Public base URL. "auto" locks the hostname from the first FQDN request.
# Set an explicit URL for OAuth login and webhooks.
# Example: "https://caic.example.com" or "https://caic.my-tailnet.ts.net"
#external_url = "auto"

# UDP port for WebRTC ICE (single-port mux). 0 disables WebRTC voice.
# Requires libopus-dev at build time (CGO_ENABLED=1).
# Open this port in your firewall for UDP traffic.
#webrtc_port = 0

# Path to a MaxMind MMDB file for country-code resolution and logging.
# Download GeoLite2-Country.mmdb from https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
# Relative paths are resolved against the config directory.
#geo_db = "GeoLite2-Country.mmdb"

# Allowed origins. Requests from IPs that do not match are rejected with
# HTTP 403.
# Named origins: "local" (loopback/private), "tailscale" (100.64.0.0/10),
#   "github" (GitHub webhook IPs fetched from api.github.com/meta).
# CIDR ranges: e.g. "203.0.113.0/24".
# Country codes: ISO 3166-1 alpha-2 (e.g. "CA", "US", "DE"); requires geo_db.
#allow_origins = ["local", "tailscale", "github"]

# ── AI ───────────────────────────────────────────────────────────────────────

[ai]
# LLM provider for title generation, commit descriptions, etc.
# When unset, auto-detects the best available provider in this order:
#   1. codex (Codex)
#   2. opencode (OpenCode)
#   3. claudecode (Claude Code)
#   4. gemini (Gemini)
#   5. Any other available provider
# Available providers: https://pkg.go.dev/github.com/maruel/genai/providers
#provider = ""

# Model name or alias. When unset, uses the provider's cheapest model.
#model = ""

# Gemini API key — required for Gemini Live voice agent and title generation
# when provider is "gemini". Falls back to GEMINI_API_KEY environment variable
# if not set. Obtain from https://aistudio.google.com/app/apikey
#gemini_api_key = ""

# ── GitHub ───────────────────────────────────────────────────────────────────
# Choose one of PAT (token) or OAuth; GitHub App is independent.

[github]
# PAT — single-user / headless. Mutually exclusive with OAuth.
# Create at https://github.com/settings/personal-access-tokens/new
# Required permissions: pull_requests:write, checks:read
# If unset and gh CLI is in PATH (and OAuth is not configured), caic uses
# the token from `gh auth token` automatically.
#token = ""

# OAuth — multi-user login. Mutually exclusive with token.
# See https://docs.caic.xyz/caic/github for OAuth app setup instructions.
#oauth_client_id = ""
#oauth_client_secret = ""
# GitHub users allowed to login. Highly recommended.
#oauth_allowed_users = ["alice", "bob"]

# GitHub App — org-wide webhooks and automatic task creation.
# Layered on top of PAT or OAuth; not mutually exclusive with either.
# See https://docs.caic.xyz/caic/ for GitHub App setup instructions.
#app_id = 0
# Path to PEM file (relative paths resolve against the config directory).
#app_private_key_pem = "private-key.pem"
# Owners/orgs allowed to install the app. Installs from other accounts are
# rejected automatically. Highly recommended.
#app_allowed_owners = ["my-org", "my-username"]

# HMAC-SHA256 secret for webhook verification.
# Generate with: openssl rand -hex 32
#webhook_secret = ""

# ── GitLab ───────────────────────────────────────────────────────────────────
# Choose one of PAT (token) or OAuth.

[gitlab]
# PAT — single-user / headless. Mutually exclusive with OAuth.
# Create at https://gitlab.com/-/user_settings/personal_access_tokens
# Required scope: api
#token = ""

# OAuth — multi-user login. Mutually exclusive with token.
# See https://docs.caic.xyz/caic/gitlab for OAuth app setup instructions.
#oauth_client_id = ""
#oauth_client_secret = ""
# GitLab users allowed to login. Highly recommended.
#oauth_allowed_users = ["alice", "bob"]

# GitLab instance URL.
#url = "https://gitlab.com"

# Shared secret for webhook verification.
# Generate with: openssl rand -hex 32
#webhook_secret = ""

# ── Debug ────────────────────────────────────────────────────────────────────

[debug]
# Log level: debug, info, warn, error.
#log_level = "info"

# Omit timestamps from log output.
#no_log_time = false

# Expose /debug/pprof/* profiling endpoints.
#pprof = false

# Write CPU profile to file.
#cpuprofile = ""

# Write heap profile to file on shutdown.
#memprofile = ""

# Write execution trace to file.
#trace = ""
