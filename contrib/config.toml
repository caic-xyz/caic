provider = "alibaba"
model = "qwen3.8-flash"
effort = "low"

# An arbitrary OpenAI-compatible chat endpoint:
# [[voice-gateway.config.chat]]
# label = "Remote compatible LLM"
# provider = "openaicompatible"
# remote = "https://llm.example/v1/chat/completions"
# model = "your-model"
# api_key_name = "REMOTE_LLM_API_KEY"

# Local ASR/LLM/TTS stack.
# Set text_only = true on the local_stack entry and omit ASR/TTS to use client speech.
# [[voice-gateway.config.local_stack]]
# label = "Local stack"
# [voice-gateway.config.local_stack.llm]
# provider = "llamacpp"
# llamacppsrv = true
# model = "unsloth/gemma-4-E2B-it-GGUF:UD-Q4_K_XL"
# effort = "low"
# [voice-gateway.config.local_stack.asr]
# engine = "openai-audio"
# remote = "http://127.0.0.1:8000"
# model = "mlx-community/parakeet-tdt-0.6b-v3"
