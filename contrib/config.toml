provider = "deepseek"
model = "deepseek-flash"
effort = "low"

[[voice-gateway.config.chat]]
# https://openrouter.ai/minimax/minimax-m3.1-flash
# From $0.1125/MTok in, $0.45/MTok out (25% promotion); list: $0.15/MTok in, $0.60/MTok out.
