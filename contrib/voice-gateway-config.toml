# voice-gateway configuration
# Copy to ~/.config/voice-gateway/config.toml.
#
# With systemd, put API keys in ~/.config/systemd/user/voice-gateway.env,
# beside voice-gateway.service. See https://github.com/maruel/gomode/blob/main/contrib/voice-gateway.env.example for the format.
#
# Provider names come from genai's providers.All registry at https://github.com/maruel/genai
#
# At standalone startup, unavailable providers are hidden with a warning.
#
# Set effort on [[realtime]] or [[llm]] definitions:
# Omit effort to send no effort option; "off" requests minimal thinking;
# "low", "medium", "high", "xhigh", and "max" request increasing effort.
# Supported levels depend on the model. Omit it for models that reject effort.
#
# Prices checked 2026-11-05: USD, uncached input and output.

[server]
# Use an HTTPS reverse proxy for secure signaling.
http = "127.0.0.1:3479"
# Expected public origin. Trusted proxies may supply forwarded host/scheme;
# otherwise the request Host must match.
# external_url = "https://voice.example.com"
# Only these direct peers may supply X-Forwarded-For or X-Real-IP.
# Their resolved client IP drives access logs and origin filtering.
# trusted_proxies = ["127.0.0.1/32", "::1/128"]
# GeoIP is disabled when both settings are absent. geo_db alone enriches logs;
# relative paths resolve beside this config file; ~ expands to your home directory.
# geo_db = "GeoLite2-Country.mmdb"
# A nonempty allowlist rejects other origins. Two-letter country codes need geo_db and must occur in it;
# local, tailscale, anthropic, github, openai and CIDRs can be used without it.
# GitHub/OpenAI ranges are cached under the user cache directory.
# allow_origins = ["local", "tailscale", "github", "CA", "203.0.113.0/24"]
# Enables the live-test UI and unauthenticated test routes on this listener.
# Anyone who can access it can use your voice backends.
debug_frontend = false
# The WebRTC UDP port must be reachable by clients (directly or through NAT).
webrtc_udp_port = 3480
# Log level: debug, info (default), warn, or error.
# log_level = "info"

[debug]
# Go execution trace output, readable with go tool trace. Empty disables tracing.
# trace = "/tmp/voice-gateway.trace"

# Managed LLMs, speech stages, and native llama.cpp audio load on first use.
# A choice counts as one instance, including its ASR/LLM/TTS workers. Active
# sessions pin instances; another choice waits when all instances are busy.
# Idle choices are evicted first when capacity is needed. External servers
# remain operator-owned.
[local_stack_runtime]
idle_timeout_seconds = 3600
max_instances = 1

# [[trusted_issuers]]
# service = "replace-with-host-service"
# issuer = "https://host.example"
# oauth = true

# Realtime Audio models.

[[realtime]]
# https://aistudio.google.com/docs/pricing#gemini-3.8-live
# Text: $0.75/MTok in, $4.50/MTok out. Audio: $0.30/hr in, $1.08/hr out.
label = "Gemini Live"
provider = "gemini"
model = "gemini-3.8-live"

[[realtime]]
# https://aistudio.google.com/docs/pricing#gemini-3.8-live
# Text: $0.75/MTok in, $4.50/MTok out. Audio: $0.30/hr in, $1.08/hr out.
label = "Gemini Live Thinking"
provider = "gemini"
model = "gemini-3.8-live-extended-thinking"

[[realtime]]
# https://developers.openai.com/api/docs/models/gpt-realtime-2.1-mini
# Text: $0.60/MTok in, $2.40/MTok out. Audio: ~$0.36/hr in, ~$1.44/hr out.
label = "GPT Realtime mini"
provider = "openai"
model = "gpt-realtime-2.1-mini"
effort = "low"

[[realtime]]
# https://developers.openai.com/api/docs/models/gpt-realtime-2.1
# Text: $4.00/MTok in, $24.00/MTok out. Audio: ~$1.152/hr in, ~$4.608/hr out.
label = "GPT Realtime ($)"
provider = "openai"
model = "gpt-realtime-2.1"
effort = "low"

# Native audio-to-audio LFM3, independent of the ASR/LLM/TTS stack.
# llamacppsrv downloads and starts the managed llama.cpp audio server.
[[realtime]]
label = "LFM3 audio"
provider = "llamacpp"
llamacppsrv = true
model = "LiquidAI/LFM3-Audio-2B-GGUF/LFM3-Audio-2B-Q4_K_M.gguf"
context_size = 65536
# remote = "http://127.0.0.1:8080" directly on the choice.

# Single-model alternative: speech input -> text thinking/tools -> LFM3 speech.
# Chat generation completes before synthesis, sharing one loaded model and slot.
[[realtime]]
label = "LFM3 audio thinking (staged)"
provider = "llamacpp"
llamacppsrv = true
model = "LiquidAI/LFM3-Audio-2B-GGUF/LFM3-Audio-2B-Q4_K_M.gguf"
staged = true
effort = "medium"
context_size = 65536

# Remote LLMs
# Select recognition and synthesis independently for named LLMs. Credentials are listed in
# https://github.com/maruel/gomode/blob/main/contrib/voice-gateway.env.example, using genai's provider environment variables.

[[llm]]
id = "gpt_luna_codex"
label = "GPT 6 Luna (Codex)"
# Uses the existing Codex login and subscription quota.
provider = "openai"
auth = "codex"
model = "gpt-6-luna"
effort = "low"

[[llm]]
id = "gpt_luna"
label = "GPT 6 Luna (API)"
# https://developers.openai.com/api/docs/models/gpt-6-luna
# $0.10/MTok in, $0.50/MTok out; prompts >272K tokens: $0.20/MTok in, $0.75/MTok out.
# Uses OPENAI_API_KEY and API billing, independently of the Codex login.
provider = "openai"
model = "gpt-6-luna"
effort = "low"

[[llm]]
id = "claude_haiku_5_5"
label = "Claude Haiku 5.5"
# https://platform.claude.com/docs/en/models/haiku-5-5/overview
# $0.10/MTok in, $0.50/MTok out; prompts >100K tokens: $0.50/MTok in, $2.50/MTok out.
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"

[[llm]]
id = "gemini_flash_3_8"
