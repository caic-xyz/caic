# voice-gateway configuration
# Copy to ~/.config/voice-gateway/config.toml and edit as needed.

# ── Gemini ───────────────────────────────────────────────────────────────────

# Gemini Live model used by the gateway. The API key is always read from
# GEMINI_API_KEY.
#model = "gemini-3.1-flash-live-preview"

# ── Server ───────────────────────────────────────────────────────────────────

[server]
# HTTP listen address for voice gateway signaling.
#http = ":3479"

# UDP port for WebRTC ICE (single-port mux).
# 0 (default) = enabled with OS-assigned ephemeral port.
# >0 = enabled on that static port (open it in your firewall for UDP traffic).
# GEMINI_API_KEY is required.
#webrtc_udp_port = 0

# ── Trusted Service Token Issuers ────────────────────────────────────────────

# Import the public key exposed by a service backend. The service keeps the
# private key and signs short-lived voice-gateway tokens for authenticated users.
#[[trusted_issuers]]
#service = "caic"
#issuer = "https://caic.example.com"
#public_key = "ed25519:..."
