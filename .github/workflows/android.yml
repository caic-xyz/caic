# CI workflow for Android build, lint, unit tests, and E2E tests.
name: Android
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'scripts/android*.*'
      - 'sdk/**'
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'scripts/android*.*'
      - 'sdk/**'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Check
        run: make android-check
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apks
          path: |
            android/caic/build/outputs/apk/debug/caic-debug.apk
            android/gomode/build/outputs/apk/debug/gomode-debug.apk
          retention-days: 7
      - name: Upload Coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: android-unit
          files: android/caic/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml,android/gomode/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml,sdk/halo/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: |
            android/*/build/reports/lint-results-debug.xml
            android/*/build/reports/detekt/
            sdk/halo/build/reports/lint-results-debug.xml
            sdk/halo/build/reports/detekt/
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            android/*/build/reports/tests/
            sdk/**/build/reports/tests/
          retention-days: 14

  android-e2e:
    name: E2E tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: E2E Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048 -partition-size 4096
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb shell 'while ! pm list packages > /dev/null 2>&1; do echo "Waiting for package manager..."; sleep 2; done'
            make android-e2e
      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-logs
          path: |
            android/*/build/reports/androidTests/connected/**
            android/*/build/outputs/androidTest-results/connected/**
          retention-days: 7
