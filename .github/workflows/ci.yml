# CI workflow for pushes to main and pull requests.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: [gh-pages]
permissions:
  contents: read
env:
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Lint (Go)
        if: runner.os == 'Linux'
        run: make lint-go
      - name: Lint (Frontend)
        if: runner.os == 'Linux'
        run: make lint-frontend
      - name: Lint (Binaries)
        if: runner.os == 'Linux'
        run: make lint-binaries
      - run: make build
      - name: Test
        if: runner.os != 'Linux'
        run: make test
      - name: Coverage
        if: runner.os == 'Linux'
        run: make coverage
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: End-to-end tests
        id: frontend-e2e
        if: runner.os == 'Linux'
        run: make frontend-e2e
      - name: Upload E2E failure artifacts
        if: failure() && steps.frontend-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload Coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out,frontend/coverage/lcov.info

  smoke:
    name: "smoke: ubuntu-latest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Smoke test
        run: make smoke
      - name: Upload Smoke Coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
