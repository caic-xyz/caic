# CI workflow for pushes to main and pull requests.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: [gh-pages]
permissions:
  contents: read
env:
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - name: Lint (Go)
        if: runner.os == 'Linux'
        run: make lint-go
      - name: Lint (Frontend)
        if: runner.os == 'Linux'
        run: make lint-frontend
      - name: Lint (Binaries)
        if: runner.os == 'Linux'
        run: make lint-binaries
      - run: make build
      - name: Test
        if: runner.os != 'Linux'
        run: make test
      - name: Coverage
        if: runner.os == 'Linux'
        run: make coverage
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: End-to-end tests
        id: frontend-e2e
        if: runner.os == 'Linux'
        run: make frontend-e2e
      - name: Upload E2E failure artifacts
        if: failure() && steps.frontend-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload Coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out,frontend/coverage/lcov.info

  # Parked: the job stays and starts only once the repository variable
  # CAIC_RENDER_SCREENSHOTS is set to true, because rendering the documentation
  # screenshots is not a signal the project wants on pull requests yet.
  screenshots:
    name: "screenshots: ubuntu-latest"
    if: ${{ vars.CAIC_RENDER_SCREENSHOTS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render frontend documentation screenshots
        id: screenshots
        run: make screenshots-generate-frontend
      - name: Upload screenshot failure artifacts
        if: failure() && steps.screenshots.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-failure-artifacts
          path: |
            test-results/
            visual-screenshots-failures/
          if-no-files-found: ignore
          retention-days: 3

  smoke:
    name: "smoke: ubuntu-latest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Smoke test
        run: make smoke
      - name: Upload Smoke Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
