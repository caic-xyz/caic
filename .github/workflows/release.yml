# Release workflow triggered manually to build and publish versioned binaries.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0). Leave empty to auto-increment patch version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Determine Version
        id: get_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            echo "Using provided version: $INPUT_VERSION"
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No version provided. Calculating next patch version..."
            git fetch --tags --force
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            echo "Latest tag found: $LATEST_TAG"
            VERSION_NO_V="${LATEST_TAG#v}"
            IFS='.' read -r -a parts <<< "$VERSION_NO_V"
            MAJOR="${parts[0]:-0}"
            MINOR="${parts[1]:-0}"
            PATCH="${parts[2]:-0}"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
            echo "Auto-incremented version: $NEW_VERSION"
            echo "VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: version '$VERSION' does not match v{major}.{minor}.{patch} format" >&2
            exit 1
          fi
      - name: Tag and push
        run: |
          git tag "${{ steps.get_version.outputs.VERSION }}"
          git push origin "${{ steps.get_version.outputs.VERSION }}"
      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.get_version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Temporary: re-upload linux_amd64 as linux_x86_64 for buggy auto-update compat.
      # Remove once all deployed instances have upgraded past the fix.
      - name: Upload x86_64 compat archive
        env:
          TAG: ${{ steps.get_version.outputs.VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NO_V="${TAG#v}"
          AMD64="caic_${TAG_NO_V}_linux_amd64.tar.gz"
          COMPAT="caic_${TAG_NO_V}_linux_x86_64.tar.gz"
          echo "Downloading $AMD64 and checksums..."
          gh release download "$TAG" --repo caic-xyz/caic --pattern "$AMD64" --pattern checksums.txt --dir /tmp
          echo "Uploading as $COMPAT..."
          gh release upload "$TAG" "/tmp/$AMD64#$COMPAT" --repo caic-xyz/caic --clobber
          # Append compat checksum (same sha256, just different filename)
          SUM=$(grep "$AMD64" /tmp/checksums.txt | awk '{print $1}')
          echo "$SUM  $COMPAT" >> /tmp/checksums.txt
          gh release upload "$TAG" /tmp/checksums.txt --repo caic-xyz/caic --clobber
