packages:
  - path: "github.com/caic-xyz/caic/backend/internal/server/dto/v1"
    output_path: "../../../../../sdk/ts/v1/types.gen.ts"
    exclude_files:
      - validate.go
      - routes.go
    frontmatter: |
      /** ISO 8601 timestamp string (e.g. "2026-04-13T12:00:00Z"). */
      export type ISOTimestamp = string & { readonly __brand: "ISOTimestamp" };
    type_mappings:
      ksid.ID: "string"
      time.Time: "ISOTimestamp"
