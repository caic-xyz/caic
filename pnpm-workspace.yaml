# pnpm configuration
engineStrict: true
minimumReleaseAge: 11520
minimumReleaseAgeExclude:
  - "@pnpm/*"
  - pnpm

allowBuilds:
  # Allow esbuild's build script so frozen dependency installation succeeds.
  esbuild: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

# Make installs dependencies before parallel checks. Commands fail on stale
# dependencies instead of launching competing installations.
verifyDepsBeforeRun: error
